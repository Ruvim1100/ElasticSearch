name: Academy · Build and Validate
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/academy-pages.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Verify generated catalog is committed
        run: |
          git diff --exit-code -- site/data/catalog.json site/data/catalog.js
      - name: Upload static portal as private workflow artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: elastic-academy-portal
          path: site/
          retention-days: 3
# Pages deployment intentionally disabled for this private repository.
# Enable publishing only after explicitly reviewing privacy and access.
